<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛠️ 潜艇部件材料计算器</title>
    <!-- 引入 CSS 文件 -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="app-container">
    <div class="panel col-left">
        <div class="panel-header">
            <h2>🚢 部件选择</h2>
            <button onclick="clearAllData()" class="clear-btn">清空保存的库存</button>
        </div>
        <div class="panel-body">
            <table class="matrix-table">
                <thead>
                    <tr><th>部位</th><th>船体 (1)</th><th>船尾 (2)</th><th>船首 (3)</th><th>舰桥 (4)</th></tr>
                </thead>
                <tbody id="matrixBody"></tbody>
            </table>
            <div class="info-box">
                <p style="margin-top: 0; font-weight: bold; color: var(--text-main);">💡 说明：</p>
                <p>如果在 JSON 中配置了该部件的配方，格子会亮起并可点击。</p>
            </div>
        </div>
    </div>
    
    <div class="panel col-mid">
        <div class="panel-header"><h2>📋 材料需求清单</h2></div>
        <div class="panel-body" id="craftBody">
            <div class="empty-state">请在左侧选择一个部件</div>
        </div>
    </div>
    
    <div class="panel col-right">
        <div class="panel-header"><h2>📦 现有库存</h2></div>
        <div class="panel-body" id="inventoryBody"></div>
    </div>
</div>

<!-- 引入 JS 文件 -->
<script src="./app.js"></script>
</body>
</html>
