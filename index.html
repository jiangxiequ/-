<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛠️ 潜艇部件材料计算器</title>
<style>
    /* CSS 样式跟刚才完全一样，未作任何修改 */
    :root {
        --bg-color: #f0f4f8; --panel-bg: #ffffff; --text-main: #1e293b; --text-sub: #64748b;
        --border-color: #e2e8f0; --primary: #3b82f6; --primary-hover: #2563eb;
        --hover-bg: #f1f5f9; --selected-bg: #dbeafe; --selected-border: #93c5fd;
        --danger: #ef4444; --success: #10b981;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg-color); margin: 0; padding: 20px; color: var(--text-main); min-height: 100vh; }
    .app-container { display: flex; gap: 20px; max-width: 1600px; margin: 0 auto; height: calc(100vh - 40px); }
    .panel { background: var(--panel-bg); border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border-color); }
    .col-left { flex: 1.2; min-width: 350px; }
    .col-mid { flex: 1.5; min-width: 400px; }
    .col-right { flex: 1; min-width: 300px; }
    .panel-header { padding: 16px 20px; border-bottom: 1px solid var(--border-color); background: #f8fafc; display: flex; justify-content: space-between; align-items: center; }
    .panel-header h2 { font-size: 1.1rem; margin: 0; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .panel-body { padding: 20px; overflow-y: auto; flex: 1; }
    .matrix-table { width: 100%; border-collapse: collapse; text-align: center; }
    .matrix-table th, .matrix-table td { padding: 8px; border: none; }
    .matrix-table th { color: var(--text-sub); font-weight: 500; font-size: 0.9rem; }
    .matrix-table td.row-label { text-align: left; font-weight: 500; color: var(--text-main); }
    .part-btn { background: white; border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 0; width: 100%; cursor: pointer; transition: all 0.2s; color: var(--text-main); font-size: 0.95rem; font-weight: 500; }
    .part-btn:hover { background: var(--hover-bg); }
    .part-btn.active { background: var(--selected-bg); border-color: var(--selected-border); color: #1e40af; box-shadow: 0 0 0 1px var(--selected-border); }
    .part-btn.disabled { opacity: 0.3; cursor: not-allowed; background: #f1f5f9; }
    .craft-header { background: #f8fafc; padding: 16px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .craft-header h3 { margin: 0; font-size: 1.2rem; color: #0f172a; }
    .craft-amount-ctrl { display: flex; align-items: center; gap: 8px; background: white; padding: 4px; border-radius: 8px; border: 1px solid var(--border-color); }
    .craft-amount-ctrl button { width: 28px; height: 28px; border: none; background: var(--bg-color); border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1.1rem; color: var(--text-main); }
    .craft-amount-ctrl button:hover { background: var(--border-color); }
    .craft-amount-ctrl input { width: 40px; text-align: center; border: none; font-size: 1rem; font-weight: 600; outline: none; }
    .tree-list { list-style: none; padding: 0; margin: 0; }
    .tree-item { margin-bottom: 8px; }
    .tree-node { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 8px; background: white; border: 1px solid var(--border-color); cursor: pointer; transition: 0.1s; }
    .tree-node:hover { border-color: #cbd5e1; background: #f8fafc; }
    .tree-node.expanded { background: #f0f9ff; border-color: #bae6fd; }
    .node-name { display: flex; align-items: center; gap: 8px; font-weight: 500; }
    .node-icon { font-size: 1.2rem; }
    .toggle-icon { font-size: 0.8rem; color: var(--text-sub); width: 16px; display: inline-block; transition: transform 0.2s; }
    .toggle-icon.open { transform: rotate(90deg); }
    .node-stats { display: flex; gap: 16px; font-size: 0.9rem; align-items: center; }
    .stat-needed { color: var(--primary); font-weight: 600; }
    .stat-have { color: var(--text-sub); }
    .stat-missing { font-weight: 600; }
    .stat-missing.neg { color: var(--danger); }
    .stat-missing.pos { color: var(--success); }
    .stat-missing.zero { color: var(--text-sub); }
    .tree-children { list-style: none; padding-left: 24px; margin-top: 6px; border-left: 2px dashed var(--border-color); margin-left: 12px; display: none; }
    .tree-children.show { display: block; }
    .inv-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); }
    .inv-row:last-child { border-bottom: none; }
    .inv-label { display: flex; align-items: center; gap: 10px; font-weight: 500; color: var(--text-main); }
    .inv-icon { width: 32px; height: 32px; background: #f1f5f9; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 1.1rem; border: 1px solid var(--border-color); }
    .inv-input { width: 70px; padding: 6px; border: 1px solid var(--border-color); border-radius: 6px; text-align: center; font-weight: 500; outline: none; transition: 0.2s; }
    .inv-input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px var(--selected-bg); }
    .badge { background: var(--selected-bg); color: var(--primary); padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
    .empty-state { text-align: center; color: var(--text-sub); padding: 40px 20px; }
</style>
</head>
<body>

<div class="app-container">
    <div class="panel col-left">
        <div class="panel-header"><h2>🚢 部件选择</h2></div>
        <div class="panel-body">
            <table class="matrix-table">
                <thead>
                    <tr><th>部位</th><th>船体 (1)</th><th>船尾 (2)</th><th>船首 (3)</th><th>舰桥 (4)</th></tr>
                </thead>
                <tbody id="matrixBody"></tbody>
            </table>
            <div style="margin-top: 30px; padding: 16px; background: #f8fafc; border-radius: 12px; border: 1px solid var(--border-color); font-size: 0.9rem; color: var(--text-sub);">
                <p style="margin-top: 0; font-weight: bold; color: var(--text-main);">💡 说明：</p>
                <p>如果在 JSON 中配置了该部件的配方，格子会亮起并可点击。</p>
            </div>
        </div>
    </div>
    <div class="panel col-mid">
        <div class="panel-header"><h2>📋 材料需求清单</h2></div>
        <div class="panel-body" id="craftBody"><div class="empty-state">请在左侧选择一个部件</div></div>
    </div>
    <div class="panel col-right">
        <div class="panel-header"><h2>📦 现有库存 (填入数字)</h2></div>
        <div class="panel-body" id="inventoryBody"></div>
    </div>
</div>

<script>
(function() {
    // 全局状态
    let allItems = {};
    let recipes = {};
    let partsDB = {};
    
    let currentPartCode = null;
    let craftAmount = 1;
    let inventory = {};

    const matrixBody = document.getElementById('matrixBody');
    const craftBody = document.getElementById('craftBody');
    const inventoryBody = document.getElementById('inventoryBody');

    const rows = [
        { level: 1, name: '鲨鱼级' },
        { level: 2, name: '甲鳖级' },
        { level: 3, name: '须鲸级' },
        { level: 4, name: '腔棘鱼级' },
        { level: 5, name: '希尔德拉' }
    ];

    // 加载数据
    async function loadData() {
        const res = await fetch('./items.json');
        const data = await res.json();
        
        allItems = data.items;
        recipes = data.recipes;
        partsDB = data.parts;

        // 初始化库存
        Object.keys(allItems).forEach(id => inventory[id] = 0);

        // 区分基础材料(T0)和合成材料(T1及以上)
        // 简单的判断方法：如果有配方，就是合成材料
        window.t0Keys = [];
        window.t1Keys = [];
        Object.keys(allItems).forEach(id => {
            if (recipes[id]) {
                t1Keys.push(id);
            } else {
                t0Keys.push(id);
            }
        });
    }

    // 计算需求树
    function calcRequirements(itemId, amount, reqMap = new Map()) {
        if (!reqMap.has(itemId)) reqMap.set(itemId, 0);
        reqMap.set(itemId, reqMap.get(itemId) + amount);
        const recipe = recipes[itemId];
        if (recipe) {
            for (let comp of recipe) {
                calcRequirements(comp.item, amount * comp.amount, reqMap);
            }
        }
        return reqMap;
    }

    // 渲染矩阵
    function renderMatrix() {
        matrixBody.innerHTML = '';
        rows.forEach(row => {
            const tr = document.createElement('tr');
            const tdLabel = document.createElement('td');
            tdLabel.className = 'row-label';
            tdLabel.textContent = row.name;
            tr.appendChild(tdLabel);

            for (let i = 0; i < 4; i++) {
                const td = document.createElement('td');
                let codeArr = ['0', '0', '0', '0'];
                codeArr[i] = row.level.toString();
                const code = codeArr.join('');

                const btn = document.createElement('button');
                btn.className = 'part-btn';
                btn.textContent = row.level;
                
                if (partsDB[code]) {
                    btn.onclick = () => {
                        document.querySelectorAll('.part-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentPartCode = code;
                        craftAmount = 1;
                        renderCraftPanel();
                    };
                    if (currentPartCode === code) btn.classList.add('active');
                } else {
                    btn.classList.add('disabled');
                    btn.title = '暂无此部件数据';
                }
                td.appendChild(btn);
                tr.appendChild(td);
            }
            matrixBody.appendChild(tr);
        });
    }

    // 渲染中间面板
    function renderCraftPanel() {
        if (!currentPartCode || !partsDB[currentPartCode]) {
            craftBody.innerHTML = '<div class="empty-state">请在左侧选择一个部件</div>';
            return;
        }

        const part = partsDB[currentPartCode];
        
        let html = `
            <div class="craft-header">
                <div>
                    <h3>${part.name} <span class="badge">${currentPartCode}</span></h3>
                    <div style="font-size:0.85rem; color:var(--text-sub); margin-top:4px;">制作 ${craftAmount} 份所需</div>
                </div>
                <div class="craft-amount-ctrl">
                    <button onclick="updateAmount(-1)">-</button>
                    <input type="number" min="1" value="${craftAmount}" onchange="setAmount(this.value)">
                    <button onclick="updateAmount(1)">+</button>
                </div>
            </div>
            <ul class="tree-list">
        `;

        function renderNode(itemId, neededAmount) {
            const item = allItems[itemId];
            if (!item) return '';
            const have = inventory[itemId] || 0;
            const missing = Math.max(0, neededAmount - have);
            const missingClass = missing > 0 ? 'neg' : (neededAmount - have < 0 ? 'pos' : 'zero');
            const hasRecipe = recipes[itemId];

            let nodeHtml = `
                <li class="tree-item">
                    <div class="tree-node" onclick="toggleTree(this)">
                        <div class="node-name">
                            ${hasRecipe ? '<span class="toggle-icon">▶</span>' : '<span class="toggle-icon" style="opacity:0">▶</span>'}
                            <span class="node-icon">${item.icon}</span>
                            ${item.name}
                        </div>
                        <div class="node-stats">
                            <span class="stat-needed">需: ${neededAmount}</span>
                            <span class="stat-have">库: ${have}</span>
                            <span class="stat-missing ${missingClass}">缺: ${missing}</span>
                        </div>
                    </div>
            `;

            if (hasRecipe) {
                nodeHtml += `<ul class="tree-children">`;
                const actualCraftAmount = Math.max(0, neededAmount - have);
                for (let comp of recipes[itemId]) {
                    const childNeeded = actualCraftAmount * comp.amount;
                    nodeHtml += renderNode(comp.item, childNeeded);
                }
                nodeHtml += `</ul>`;
            }
            nodeHtml += `</li>`;
            return nodeHtml;
        }

        for (let comp of part.recipe) {
            html += renderNode(comp.item, comp.amount * craftAmount);
        }
        html += `</ul>`;
        
        // 底部汇总基础材料
        html += `<div style="margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 20px;">
            <h4 style="margin: 0 0 10px 0; color: var(--text-main);">🧱 基础材料总计 (T0)</h4>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.9rem;">`;
        
        const baseTotals = {};
        function addBaseReqs(itemId, amount) {
            const recipe = recipes[itemId];
            if (recipe) {
                for (let comp of recipe) addBaseReqs(comp.item, amount * comp.amount);
            } else {
                baseTotals[itemId] = (baseTotals[itemId] || 0) + amount;
            }
        }
        
        for (let comp of part.recipe) {
            addBaseReqs(comp.item, comp.amount * craftAmount);
        }

        for (let [id, total] of Object.entries(baseTotals)) {
            const item = allItems[id];
            const have = inventory[id] || 0;
            const miss = total - have;
            const color = miss > 0 ? 'var(--danger)' : 'var(--success)';
            html += `<div style="display:flex; justify-content:space-between; padding:6px 12px; background:#f8fafc; border-radius:6px;">
                <span>${item.icon} ${item.name}</span>
                <span>总需 <b>${total}</b> / 缺 <b style="color:${color}">${Math.max(0, miss)}</b></span>
            </div>`;
        }
        html += `</div></div>`;

        craftBody.innerHTML = html;
    }

    // 渲染库存
    function renderInventory() {
        inventoryBody.innerHTML = '';
        
        const createGroup = (title, keys) => {
            const groupDiv = document.createElement('div');
            groupDiv.innerHTML = `<div style="font-size:0.8rem; color:var(--text-sub); margin-bottom:10px; font-weight:600;">${title}</div>`;
            
            keys.forEach(key => {
                const item = allItems[key];
                if(!item) return; // 防止空数据
                const row = document.createElement('div');
                row.className = 'inv-row';
                const label = document.createElement('div');
                label.className = 'inv-label';
                label.innerHTML = `<div class="inv-icon">${item.icon}</div> <span>${item.name}</span>`;
                const input = document.createElement('input');
                input.type = 'number';
                input.className = 'inv-input';
                input.min = '0';
                input.value = inventory[key];
                input.oninput = (e) => {
                    let v = parseInt(e.target.value) || 0;
                    if (v < 0) v = 0;
                    inventory[key] = v;
                    renderCraftPanel(); // 联动刷新中间
                };
                row.appendChild(label);
                row.appendChild(input);
                groupDiv.appendChild(row);
            });
            return groupDiv;
        };

        inventoryBody.appendChild(createGroup('基础材料', window.t0Keys));
        const spacer = document.createElement('div'); spacer.style.height = '20px';
        inventoryBody.appendChild(spacer);
        inventoryBody.appendChild(createGroup('合成材料', window.t1Keys));
    }

    window.updateAmount = function(delta) {
        craftAmount = Math.max(1, craftAmount + delta);
        renderCraftPanel();
    };
    window.setAmount = function(val) {
        craftAmount = Math.max(1, parseInt(val) || 1);
        renderCraftPanel();
    };
    window.toggleTree = function(el) {
        const icon = el.querySelector('.toggle-icon');
        const children = el.nextElementSibling;
        if (children && children.classList.contains('tree-children')) {
            children.classList.toggle('show');
            if (icon) icon.classList.toggle('open');
        }
    };

    async function init() {
        await loadData();
        renderMatrix();
        renderInventory();
        // 默认选中第一个有数据的部件
        const firstCode = Object.keys(partsDB)[0];
        if (firstCode) {
            currentPartCode = firstCode;
            renderMatrix();
            renderCraftPanel();
        }
    }

    init();
})();
</script>
</body>
</html>
